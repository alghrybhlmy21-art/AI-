<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشيخ AI بالصوت - حلمي الغريب</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --grad1: #0d5c63; --grad2: #44a1a0; --gold: #ffc107; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, var(--grad1), var(--grad2)); min-height: 100vh; padding: 15px; }
        
        .header { background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); border-radius: 25px; text-align: center; padding: 30px; margin-bottom: 20px; }
        .header h1 { font-size: 42px; font-weight: 900; color: white; }
        .header p { color: #e0f2f1; font-size: 18px; }
        
        .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
        
        .chat-card, .side-card { background: rgba(255,255,255,0.12); backdrop-filter: blur(20px); border-radius: 25px; padding: 25px; }
        
        .chat-box { height: 520px; overflow-y: auto; padding: 10px; margin-bottom: 20px; }
        .message { padding: 16px 20px; border-radius: 18px; margin: 12px 0; max-width: 85%; font-size: 17px; animation: slideIn 0.4s ease; }
        @keyframes slideIn { from{transform:translateX(30px);opacity:0} to{transform:translateX(0);opacity:1} }
        .user-msg { background: linear-gradient(135deg, var(--grad1), var(--grad2)); color: white; margin-right: auto; }
        .bot-msg { background: rgba(255,255,255,0.9); color: #333; margin-left: auto; display: flex; justify-content: space-between; align-items: center; }
        
        .input-area { display: flex; gap: 12px; }
        input { flex: 1; padding: 18px; border: none; border-radius: 15px; background: rgba(255,255,255,0.9); font-size: 17px; }
        .send-btn { padding: 18px 40px; border: none; border-radius: 15px; background: linear-gradient(135deg, var(--gold), #ff9800); font-weight: 900; cursor: pointer; }
        .voice-btn { background: none; border: none; font-size: 24px; cursor: pointer; margin-right: 10px; }
        .voice-btn:hover { transform: scale(1.2); }
        
        .side-card h3 { color: white; font-size: 22px; margin-bottom: 15px; }
        .quick-btn { width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 12px; background: rgba(255,255,255,0.15); color: white; cursor: pointer; text-align: right; font-size: 16px; }
        
        @media(max-width: 950px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧔🤖 الشيخ AI بالصوت</h1>
        <p>مقدم من: حلمي الغريب - الازهر الشريف</p>
    </div>

    <div class="container">
        <div class="chat-card">
            <div class="chat-box" id="chatBox">
                <div class="message bot-msg">
                    <span>السلام عليكم. دوس على 🔊 عشان تسمعني</span>
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="اسأل سؤالك هنا...">
                <button class="send-btn" onclick="sendMessage()">ارسال</button>
            </div>
        </div>

        <div class="side-card">
            <h3>📚 اسئلة سريعة</h3>
            <button class="quick-btn" onclick="ask('ما حكم الصلاة؟')">حكم الصلاة</button>
            <button class="quick-btn" onclick="ask('كيف اتوب الى الله؟')">كيف اتوب</button>
            <button class="quick-btn" onclick="ask('ما فضل قراءة القران؟')">فضل القران</button>
        </div>
    </div>

    <script>
        // قاعدة البيانات
        const knowledgeBase = [
            {key: ['صلاة'], ans: 'الصلاة عماد الدين. قال تعالى: ان الصلاة كانت على المؤمنين كتابا موقوتا'},
            {key: ['صيام'], ans: 'الصيام فرض في رمضان. قال تعالى: كتب عليكم الصيام'},
            {key: ['زكاة'], ans: 'الزكاة 2.5% من المال الذي بلغ النصاب'},
            {key: ['توبة'], ans: 'شروط التوبة: الندم والاقلاع والعزم. قال تعالى: لا تقنطوا من رحمة الله'},
            {key: ['قران'], ans: 'قراءة القران شفاء. بكل حرف 10 حسنات'},
            {key: ['default'], ans: 'سؤالك مهم. ارجع لاهل العلم في الازهر. قال تعالى: فاسألوا اهل الذكر'}
        ];

        // دالة الكلام بالصوت
        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA'; // عربي سعودي صوت واضح
            utterance.rate = 0.9; // سرعة الكلام
            utterance.pitch = 1; // نبرة الصوت
            speechSynthesis.speak(utterance);
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const q = input.value.trim();
            if(q === '') return;

            chatBox.innerHTML += `<div class="message user-msg">${q}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            let ans = knowledgeBase.find(x => x.key.includes('default')).ans;
            for(let item of knowledgeBase) {
                if(item.key.some(k => q.includes(k))) { ans = item.ans; break; }
            }

            setTimeout(() => {
                // نضيف زرار السماعة جنب الرد
                chatBox.innerHTML += `
                    <div class="message bot-msg">
                        <span>${ans}</span>
                        <button class="voice-btn" onclick="speak('${ans}')">🔊</button>
                    </div>
                `;
                chatBox.scrollTop = chatBox.scrollHeight;
                
                // يشغل الصوت تلقائي اول ما الرد ينزل
                speak(ans);
            }, 700);
        }
        
        function ask(q) {
            document.getElementById('userInput').value = q;
            sendMessage();
        }

        document.getElementById('userInput').addEventListener('keypress', e => { 
            if(e.key === 'Enter') sendMessage(); 
        });
    </script>
</body>
</html>
