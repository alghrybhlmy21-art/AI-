<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الشيخ AI - حلمي الغريب</title>
    <style>
        body { background: linear-gradient(135deg, #0d5c63, #44a1a0); font-family: 'Tajawal', sans-serif; padding: 20px; }
        .header { text-align: center; color: white; padding: 20px; }
        .chat-box { height: 500px; background: white; border-radius: 20px; padding: 20px; overflow-y: auto; }
        .message { padding: 15px; border-radius: 15px; margin: 10px 0; max-width: 80%; }
        .user-msg { background: #0d5c63; color: white; margin-right: auto; }
        .bot-msg { background: #f0f0f0; color: #333; margin-left: auto; }
        .input-area { display: flex; gap: 10px; margin-top: 15px; }
        input { flex: 1; padding: 15px; border-radius: 10px; border: none; }
        button { padding: 15px 30px; border-radius: 10px; background: #ffc107; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧔🤖 الشيخ AI</h1>
        <p>مقدم من: حلمي الغريب - الازهر الشريف</p>
    </div>
    
    <div class="chat-box" id="chatBox"></div>
    
    <div class="input-area">
        <input type="text" id="userInput" placeholder="اسأل سؤالك...">
        <button onclick="sendMessage()">ارسال</button>
    </div>

    <script>
        const knowledgeBase = [
            {key: ['صلاة'], ans: 'الصلاة عماد الدين. قال تعالى: ان الصلاة كانت على المؤمنين كتابا موقوتا'},
            {key: ['صيام'], ans: 'الصيام ركن. للمريض رخصة. قال تعالى: فعدة من ايام اخر'},
            {key: ['زكاة'], ans: 'الزكاة 2.5% من المال الذي بلغ النصاب'},
            {key: ['توبة'], ans: 'شروط التوبة: الندم والاقلاع والعزم. لا تقنطوا من رحمة الله'},
            {key: ['default'], ans: 'اسأل اهل العلم في الازهر. قال تعالى: فاسألوا اهل الذكر'}
        ];

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            speechSynthesis.speak(utterance);
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const q = input.value.trim();
            if(q === '') return;

            chatBox.innerHTML += `<div class="message user-msg">${q}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            let ans = knowledgeBase.find(x => x.key.includes('default')).ans;
            for(let item of knowledgeBase) {
                if(item.key.some(k => q.includes(k))) { ans = item.ans; break; }
            }

            setTimeout(() => {
                chatBox.innerHTML += `<div class="message bot-msg">${ans} <button onclick="speak('${ans}')">🔊</button></div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                speak(ans);
            }, 600);
        }
    </script>
</body>
</html>
