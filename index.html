<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--g1:#0d5c63;--g2:#44a1a0;--gold:#ffc107}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal'}
body{background:linear-gradient(135deg,var(--g1),var(--g2));min-height:100vh;padding:10px;color:#fff;transition:0.5s}
.header{text-align:center;padding:20px;background:rgba(255,255,255,0.1);border-radius:20px;margin-bottom:15px;border:2px solid var(--gold);animation:borderGlow 3s infinite}
@keyframes borderGlow{0%,100%{box-shadow:0 0 20px var(--gold)}50%{box-shadow:0 0 30px #fff}}
.header h1{font-size:32px;font-weight:900;text-shadow:0 0 10px var(--gold)}
.header p{color:var(--gold);font-weight:700}
.container{display:grid;grid-template-columns:1fr 340px;gap:15px}
.chat,.side{background:rgba(255,255,255,0.12);backdrop-filter:blur(15px);border-radius:20px;padding:20px}
.chat-box{height:420px;overflow-y:auto;margin-bottom:15px}
.msg{padding:14px;border-radius:15px;margin:10px 0;animation:slide.4s}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.user{background:var(--g1);margin-right:auto;width:85%}
.bot{background:#fff;color:#000;margin-left:auto;width:85%;border-left:4px solid var(--gold)}
.ayah{color:var(--g1);font-weight:700;display:block;margin-top:5px}
input{width:55%;padding:14px;border:none;border-radius:12px;font-size:16px}
button{padding:14px;border:none;border-radius:12px;background:var(--gold);font-weight:900;cursor:pointer;transition:0.3s}
button:hover{transform:scale(1.05)}
.mic{background:#ff5722;color:#fff}
.side h3{color:var(--gold);margin:12px 0;font-size:18px}
.side button{width:100%;margin:5px 0;background:rgba(255,255,255,0.15);color:#fff;text-align:right}
.dark{filter:invert(1) hue-rotate(180deg)}
.quiz-btn{width:100%;margin:5px 0;background:rgba(255,255,255,0.2)}
#stats{font-size:14px;color:var(--gold)}
</style>
</head>
