<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الشيخ AI DESIGN - حلمي الغريب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--g1:#0d5c63;--g2:#44a1a0;--gold:#ffc107}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal'}
body{background:linear-gradient(135deg,var(--g1),var(--g2));min-height:100vh;padding:10px;color:#fff;transition:0.5s}

/* الحواف بتنور */
.container{border:3px solid var(--gold);border-radius:25px;padding:15px;animation:borderGlow 2s infinite}
@keyframes borderGlow{0%,100%{box-shadow:0 0 15px var(--gold), inset 0 0 15px var(--gold)}50%{box-shadow:0 0 30px #fff, inset 0 0 30px #fff}}

.header{text-align:center;padding:20px;position:relative}
.header h1{font-size:34px;font-weight:900;text-shadow:0 0 10px var(--gold)}
/* زرار ليلي نهاري فوق */
.theme-btn{position:absolute;left:0;top:0;background:var(--gold);border:none;border-radius:50%;width:50px;height:50px;font-size:24px;cursor:pointer}

/* الاستيكرات بتتحرك */
.sticker{position:fixed;font-size:40px;animation:float 4s ease-in-out infinite;opacity:0.3;z-index:-1}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.s1{top:10%;right:5%}.s2{top:50%;left:3%;animation-delay:1s}.s3{bottom:10%;right:10%;animation-delay:2s}

.main-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin:20px 0}
.big-btn{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border:2px solid var(--gold);border-radius:20px;padding:25px;text-align:center;cursor:pointer;transition:0.4s;font-size:20px;font-weight:900}
.big-btn:hover{transform:scale(1.08);background:rgba(255,255,255,0.25);box-shadow:0 0 25px var(--gold)}

.chat-box{height:300px;overflow-y:auto;background:rgba(0,0,0,0.2);border-radius:15px;padding:15px;margin:15px 0}
.msg{padding:12px;border-radius:12px;margin:8px 0}
.user{background:var(--g1);width:80%;margin-right:auto}
.bot{background:#fff;color:#000;width:80%;margin-left:auto;border-left:4px solid var(--gold)}
input{width:70%;padding:14px;border:none;border-radius:12px}
button{padding:14px;border:none;border-radius:12px;background:var(--gold);font-weight:900;cursor:pointer}
.mic{background:#ff5722;color:#fff}

.dark{background:#0a0a0a!important;filter:invert(1) hue-rotate(180deg)}
.page{display:none}
.page.active{display:block}
</style>
</head>
<body id="body">

<!-- استيكرات دينية بتتحرك -->
<div class="sticker s1">📿</div>
<div class="sticker s2">🕌</div>
<div class="sticker s3">🌙</div>

<div class="container">
  <div class="header">
    <button class="theme-btn" onclick="toggleTheme()">🌙</button>
    <h1>🧔🤖 الشيخ AI</h1>
    <p>مقدم من: حلمي الغريب</p>
  </div>

  <!-- الصفحة الرئيسية - ازرار -->
  <div id="home" class="page active">
    <div class="main-grid">
      <div class="big-btn" onclick="showPage('chat')">💬 الاسئلة والفتاوى</div>
      <div class="big-btn" onclick="showPage('azkar')">🤲 الاذكار</div>
      <div class="big-btn" onclick="showPage('quran')">📖 القرآن</div>
      <div class="big-btn" onclick="showPage('dua')">🙏 الدعوات</div>
      <div class="big-btn" onclick="showPage('tools')">⚡ ادوات اسلامية</div>
      <div class="big-btn" onclick="showPage('games')">🏆 العاب وتحدي</div>
    </div>
  </div>

  <!-- صفحة الاسئلة -->
  <div id="chat" class="page">
    <button onclick="showPage('home')">⬅️ رجوع</button>
    <h2>اسأل الشيخ AI</h2>
    <div class="chat-box" id="chatBox">
      <div class="msg bot">السلام عليكم اسألني</div>
    </div>
    <input id="q" placeholder="اكتب سؤالك">
    <button onclick="send()">ارسال</button>
    <button class="mic" onclick="startVoice()">🎤</button>
  </div>

  <!-- صفحة الاذكار -->
  <div id="azkar" class="page">
    <button onclick="showPage('home')">⬅️ رجوع</button>
    <h2>🤲 الاذكار</h2>
    <button onclick="zikr('صباح')">اذكار الصباح</button>
    <button onclick="zikr('مساء')">اذكار المساء</button>
    <button onclick="zikr('نوم')">اذكار النوم</button>
  </div>

  <!-- صفحة القران -->
  <div id="quran" class="page">
    <button onclick="showPage('home')">⬅️ رجوع</button>
    <h2>📖 القرآن</h2>
    <button onclick="searchQuran()">البحث في القران</button>
    <button onclick="smartKhatma()">ختمة ذكية</button>
    <button onclick="wird()">ورد اليوم</button>
  </div>

  <!-- صفحة الدعوات -->
  <div id="dua" class="page">
    <button onclick="showPage('home')">⬅️ رجوع</button>
    <h2>🙏 الدعوات</h2>
    <button onclick="showDua('السفر')">دعاء السفر</button>
    <button onclick="showDua('الهم')">دعاء الهم</button>
    <button onclick="showDua('الركوب')">دعاء الركوب</button>
  </div>

  <!-- صفحة الادوات -->
  <div id="tools" class="page">
    <button onclick="showPage('home')">⬅️ رجوع</button>
    <h2>⚡ ادوات اسلامية</h2>
    <button onclick="showPrayer()">مواقيت الصلاة</button>
    <button onclick="showQibla()">اتجاه القبلة</button>
    <button onclick="showZakat()">حاسبة الزكاة</button>
    <button onclick="showNames()">اسماء الله الحسنى</button>
  </div>

  <!-- صفحة الالعاب -->
  <div id="games" class="page">
    <button onclick="showPage('home')">⬅️ رجوع</button>
    <h2>🏆 العاب وتحدي</h2>
    <button onclick="startQuiz()">تحدي الحفظ</button>
    <button onclick="dailyQuiz()">اختبر معلوماتك</button>
    <button onclick="story()">قصة وعبرة</button>
  </div>

</div>

<script>
const KB=[{k:['صلاة'],a:'الصلاة عماد الدين'},{k:['default'],a:'ارجع لاهل العلم'}];
const AZ={صباح:'اصبحنا واصبح الملك لله',مساء:'امسينا وامسى الملك لله',نوم:'باسمك ربي وضعت جنبي'};
const DUAS={'السفر':'سبحان الذي سخر لنا','الهم':'اللهم اني اعوذ بك من الهم','الركوب':'بسم الله'};

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function toggleTheme(){
  document.getElementById('body').classList.toggle('dark');
  document.querySelector('.theme-btn').innerText = document.getElementById('body').classList.contains('dark')?'☀️':'🌙';
}

function speak(t){let u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';speechSynthesis.speak(u)}
function send(){
  let v=document.getElementById('q').value; if(!v)return;
  document.getElementById('chatBox').innerHTML+=`<div class="msg user">${v}</div>`;
  let ans=KB.find(x=>x.k.includes('default')).a;
  for(let i of KB){if(i.k.some(k=>v.includes(k))){ans=i.a;break}}
  setTimeout(()=>{document.getElementById('chatBox').innerHTML+=`<div class="msg bot">${ans} <button onclick="speak('${ans}')">🔊</button></div>`;speak(ans)},400);
  document.getElementById('q').value='';
}

function zikr(x){alert(AZ[x]);speak(AZ[x])}
function showDua(x){alert(DUAS[x]);speak(DUAS[x])}
function showPrayer(){alert('الفجر 4:30')}
function showQibla(){alert('136 درجة')}
function showZakat(){let m=prompt('معاك كام؟'); if(m) alert(m*0.025)}
function showNames(){alert('99 اسم')}
function searchQuran(){alert('ابحث عن اية')}
function smartKhatma(){alert('اختم في 10 ايام')}
function wird(){alert('وردك 2 جزء')}
function startQuiz(){alert('سؤال: كم اركان الاسلام؟')}
function dailyQuiz(){alert('5 اسئلة')}
function story(){alert('قصة ابو بكر')}
function startVoice(){let r=new webkitSpeechRecognition(); r.lang='ar-EG'; r.onresult=e=>{document.getElementById('q').value=e.results[0][0].transcript;send()}; r.start()}
</script>
</body>
</html>
