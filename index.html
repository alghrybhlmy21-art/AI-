<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الشيخ AI PRO MAX ULTRA</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#0f4c4c;color:#fff;min-height:100vh}
.main-header{background:linear-gradient(135deg,#0f3d3d,#1a6b6b);border:2px solid #facc15;border-radius:20px;margin:15px;padding:18px;text-align:center;box-shadow:0 0 20px rgba(250,204,21,.3)}
.main-header h1{font-size:26px;font-weight:800}
.main-header p{color:#facc15;font-size:13px;margin-top:6px;font-weight:700}
.container{display:flex;gap:10px;padding:0 12px 12px;max-width:1200px;margin:auto}
.right-chat{background:#f8fafc;border-radius:20px;width:90px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;min-height:80vh}
.chat-msg{background:#fff;color:#111;padding:10px;border-radius:14px;font-size:12px;line-height:1.5}
.chat-controls{margin-top:15px;display:flex;flex-direction:column;gap:8px}
.chat-controls button{border:none;border-radius:12px;padding:10px;font-weight:700;cursor:pointer}
.btn-bn{background:#e2e8f0}.btn-send{background:#facc15}.btn-mic{background:#ff5722;color:#fff;font-size:18px}
.left-content{flex:1}
.section-title{color:#facc15;font-weight:800;margin:18px 8px 10px}
.btn-card{background:rgba(255,255,255,.15);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1);padding:14px;border-radius:14px;color:#fff;font-weight:700;cursor:pointer;text-align:center;font-size:14px}
.panel{display:none;background:#fff;color:#111;border-radius:16px;padding:18px;margin-top:12px}
.panel.show{display:block}
.prayer-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #ddd}
.qibla-compass{width:180px;height:180px;border:4px solid #0f4c4c;border-radius:50%;margin:20px auto;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="main-header">
<h1>🤖 الشيخ AI PRO<br>MAX ULTRA</h1>
<p>مقدم من: حلمي الغريب - خادم القرآن بالأزهر | 25 ميزة</p>
</div>
<div class="container">
<div class="left-content">
<div class="section-title">⚡ الحياة اليومية</div>
<div class="btn-card" onclick="openPanel('prayer')">11. مواقيت الصلاة</div>
<div id="prayer" class="panel"><h3>🕌 مواقيت الصلاة - أسيوط</h3><div id="prayerTimes">جاري التحميل...</div><button class="btn-card" style="background:#0f4c4c;color:#fff;margin-top:10px" onclick="loadPrayer()">تحديث</button></div>

<div class="btn-card" style="margin-top:8px" onclick="openPanel('qibla')">12. اتجاه القبلة</div>
<div id="qibla" class="panel"><h3>🧭 القبلة</h3><div class="qibla-compass"><div id="qiblaArrow" style="font-size:50px">🕋⬆️</div></div><p id="qiblaText" style="text-align:center;font-weight:700">القبلة: 136°</p><button class="btn-card" style="background:#0f4c4c;color:#fff" onclick="startQibla()">تفعيل البوصلة</button></div>

<div class="btn-card" style="margin-top:8px" onclick="openPanel('zakat')">13. حاسبة الزكاة</div>
<div id="zakat" class="panel"><input id="zakatInput" type="number" placeholder="المبلغ بالجنيه"><button class="btn-card" style="background:#0f4c4c;color:#fff" onclick="calcZakat()">احسب</button><div id="zakatRes" style="margin-top:10px;font-weight:800;text-align:center;background:#fef9c3;padding:10px;border-radius:8px"></div></div>
</div>
<div class="right-chat">
<div class="chat-msg">السلام عليكم 👋<br>جاهز؟ عندنا 25 ميزة</div>
<div class="chat-controls"><button class="btn-bn">بنه</button><button class="btn-send">ارسال</button><button class="btn-mic">🎤</button></div>
</div>
</div>
<script>
function openPanel(id){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));document.getElementById(id).classList.add('show');}
async function loadPrayer(){try{let res=await fetch('https://api.aladhan.com/v1/timingsByCity?city=Asyut&country=Egypt&method=5');let data=await res.json();let t=data.data.timings;document.getElementById('prayerTimes').innerHTML=`<div class="prayer-row"><span>الفجر</span><b>${t.Fajr}</b></div><div class="prayer-row"><span>الظهر</span><b>${t.Dhuhr}</b></div><div class="prayer-row"><span>العصر</span><b>${t.Asr}</b></div><div class="prayer-row"><span>المغرب</span><b>${t.Maghrib}</b></div><div class="prayer-row"><span>العشاء</span><b>${t.Isha}</b></div>`;}catch(e){document.getElementById('prayerTimes').innerText='فشل التحميل';}} loadPrayer();
function calcZakat(){let m=parseFloat(document.getElementById('zakatInput').value);if(!m)return;if(m<300000){document.getElementById('zakatRes').innerText=`لم يبلغ النصاب`;return;}document.getElementById('zakatRes').innerText=`الزكاة: ${(m*0.025).toFixed(2)} جنيه`;}
function startQibla(){window.addEventListener('deviceorientation',e=>{let h=e.webkitCompassHeading||(360-e.alpha);document.getElementById('qiblaArrow').style.transform=`rotate(${136-h}deg)`;},true);alert('لف الموبايل');}
</script>
</body>
</html>
